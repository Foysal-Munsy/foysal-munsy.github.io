name: Auto-Sync Data (Google Scholar & GitHub)

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch: # Allow manual triggering

jobs:
  sync-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scholarly==1.7.11" "python-frontmatter==1.3.0" "requests==2.34.2"
          
      - name: Sync Google Scholar Citations
        run: python .github/scripts/fetch_scholar.py
        
      - name: Sync GitHub Featured Projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/fetch_github.py
        
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-sync google scholar and github featured projects"
          file_pattern: 'src/content/research/*.md src/content/projects/*.md src/data/featuredProjects.ts'
