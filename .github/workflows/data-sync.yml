name: Auto-Sync Data (Google Scholar & GitHub)

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch: # Allow manual triggering

# The job rewrites committed data files, pushes them back, and may dispatch
# the Pages deploy. The default token is read-only otherwise, so declare what
# it may do: write data files back (contents) and start the deploy workflow
# (actions).
permissions:
  contents: write
  actions: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # httpx must stay <0.26: scholarly 1.7.11 passes `proxies=` to
          # httpx.Client, an argument removed in httpx 0.26+.
          pip install "scholarly==1.7.11" "python-frontmatter==1.3.0" "requests==2.34.2" "httpx<0.26"
          
      - name: Sync Google Scholar Citations
        run: python .github/scripts/fetch_scholar.py
        
      - name: Sync GitHub Featured Projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/fetch_github.py
        
      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-sync google scholar and github featured projects"
          file_pattern: 'src/content/research/*.md src/content/projects/*.md src/data/featuredProjects.ts'

      # Commits pushed with GITHUB_TOKEN do not retrigger push-triggered
      # workflows, so a data change would land on main but the site would
      # never rebuild. Dispatch the Pages deploy ourselves when this run
      # changed something.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
